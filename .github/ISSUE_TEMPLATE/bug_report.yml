name: Bug report
description: Wrong results, a panic, corruption, or a plan regression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — use
        [private reporting](https://github.com/celastro/celastro/security/advisories/new)
        instead. That includes anything about the `serve` console reaching SQL
        without its token.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Where you hit it
      options:
        - celastro-cli exec / run
        - celastro-cli repl
        - celastro-cli serve (browser console)
        - celastro-cli demo / catalog
        - celastro (the original REPL binary)
        - the library, used directly
        - the container image
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >-
        The smallest SQL that shows it. A single statement is fine as
        `celastro-cli exec 'SELECT ...'`; anything longer is best as a script
        run with `celastro-cli run repro.sql`. Add `--json` if the shape of the
        output is part of the report.
      render: sql
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `celastro-cli --version`.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: >-
        Output of `git rev-parse --short HEAD`, if you built from source. Skip
        it if you are running the container image.

  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc --version`. The minimum supported is 1.75.
      placeholder: rustc 1.85.0 (4d91de4e4 2025-02-17)

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.3 arm64 / Ubuntu 24.04 x86_64 / container on arm64
    validations:
      required: true

  - type: dropdown
    id: profile
    attributes:
      label: Build profile
      options:
        - release
        - dev
        - the container image
      default: 0
    validations:
      required: true

  - type: textarea
    id: explain
    attributes:
      label: EXPLAIN ANALYZE output
      description: >-
        Required for a plan regression, helpful for anything involving query
        results or performance. Leave blank if it does not apply.
      render: text

  - type: textarea
    id: panic
    attributes:
      label: Panic or error output
      description: >-
        The full message and backtrace if there was one. `RUST_BACKTRACE=1`
        works in the dev profile; the release profile aborts on panic.
      render: text
