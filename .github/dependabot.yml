version: 2
updates:
  # Actions only. There is no cargo ecosystem entry because celastro has no
  # dependencies outside std — the lockfile contains the package itself and
  # nothing else, so there is nothing for Dependabot to bump.
  #
  # Workflow actions are the one place third-party code does enter the project,
  # and ci.yml runs actions/checkout with a token in scope, so they are worth
  # keeping current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
