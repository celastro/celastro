# Pods. One is a single-node database. More than one is a cluster: each pod
# is a node with its own volume and a stable address inside the headless
# service, serves its shards to the others on `wire.port`, and attaches
# every other pod as it comes up, so a collection created `WITH (splits =
# [...])` at any of them is spread one shard per pod in pod order. Raising
# it later adds attached nodes; `REBALANCE <collection>` moves shards onto
# them. Lowering it strands the shards on the removed pods' volumes: move
# them off first (`MOVE SHARD`), then scale down.
replicas: 1

# The wire between nodes: plain TCP with a shared token and no TLS, for a
# network you trust. Served only when replicas is more than one. The token
# comes from a Secret with the key CELASTRO_WIRE_TOKEN: name an existing
# one, give one here, or leave both empty and the chart generates one and
# keeps it across upgrades.
wire:
  port: 9000
  token: ""
  existingSecret: ""

image:
  repository: ghcr.io/celastro/celastro
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The console's port inside the pod. It binds 127.0.0.1 only, so nothing
# routes to it: reach it with `kubectl port-forward`, which connects inside
# the pod's network namespace. The probes run the binary itself for the same
# reason -- the image has no shell and no curl, and a probe from outside the
# pod could not reach a loopback bind.
port: 8787

persistence:
  size: 10Gi
  # Empty means the cluster's default StorageClass.
  storageClass: ""

# The `archived` tier. With no endpoint the tier is a directory inside the
# data volume, which is what the pod gets by default. With one it is an
# S3-compatible bucket reached over plain HTTP (the binary carries no TLS),
# and the credentials come from a Secret with the keys AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY: name an existing one, or give the pair here and the
# chart makes one.
archive:
  endpoint: ""
  bucket: ""
  prefix: ""
  region: ""
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

probes:
  periodSeconds: 10
  failureThreshold: 3

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
