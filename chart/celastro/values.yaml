# Pods. One is a single-node database. More than one is a cluster: each pod
# is a node with its own volume and a stable address inside the headless
# service, serves its shards to the others on `wire.port`, and attaches
# every other pod as it comes up, so a collection created `WITH (splits =
# [...])` at any of them is spread one shard per pod in pod order. Raising
# it later adds attached nodes; `REBALANCE <collection>` moves shards onto
# them. Lowering it strands the shards on the removed pods' volumes: move
# them off first (`MOVE SHARD`), then scale down.
replicas: 1

# The wire between nodes: plain TCP with a shared token and no TLS, for a
# network you trust. Served only when replicas is more than one. The token
# comes from a Secret with the key CELASTRO_WIRE_TOKEN: name an existing
# one, give one here, or leave both empty and the chart generates one and
# keeps it across upgrades.
wire:
  port: 2352
  token: ""
  existingSecret: ""

# Encryption in transit: the wire between pods and the console's traffic
# from clients over TLS 1.3, each pod serving one certificate and verifying
# every other pod's against one CA. Off by default. On, the material comes
# from one of three places: nothing named, and a Job runs the binary's own
# generator inside the cluster (`celastro-cli tls secret`) and writes the
# Secret `<release>-tls` through the API, once, keeping it across upgrades;
# a Secret of your own with `tls.crt`, `tls.key` and `ca.crt`, made by
# `celastro-cli tls init <dir> <release> <names>` where the names are every
# pod (`<release>-<i>.<release>`), both Services and their `.svc` forms
# (the tool adds the probe's `localhost` and 127.0.0.1); or a cert-manager
# issuer, for which the chart emits a Certificate with `privateKey.algorithm:
# Ed25519` and those names (an issuer whose Secrets carry `ca.crt`: a CA
# issuer does). The node's own certificate is Ed25519; the CA above it may
# be Ed25519, RSA or P-256. The tokens stay: a certificate says which pod is
# talking, the token that it may.
tls:
  enabled: false
  existingSecret: ""
  certManager:
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
  # Validity of the certificate the Job makes, in days.
  days: 3650

image:
  repository: ghcr.io/celastro/celastro
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The console's port inside the pod. Unless `console.expose` is on it binds
# 127.0.0.1 only, so nothing routes to it: reach it with `kubectl
# port-forward`, which connects inside the pod's network namespace. The
# probes run the binary itself for the same reason -- the image has no shell
# and no curl, and a probe from outside the pod could not reach a loopback
# bind -- and they keep doing so when the console is exposed, since a bind
# on every interface includes loopback.
port: 8787

# The console beyond its pod. Off, it is reached by `kubectl port-forward`
# and answers a token printed once per start in the pod's log. On, every
# pod binds it on all interfaces and answers one shared token, and a second
# Service, `<release>-console`, spreads requests over the pods: the console
# closes every connection after one request, so a ClusterIP spreads them per
# request, not per client, and any pod coordinates a statement over every
# pod's shards. Plain HTTP with no TLS: for a network you trust, or behind
# an ingress that terminates TLS. The token comes from a Secret with the key
# CELASTRO_TOKEN -- at least sixteen printable bytes: name an existing one,
# give one here, or leave both empty and the chart generates one and keeps
# it across upgrades. `/api/health` names the pod that answered.
console:
  expose: false
  service:
    type: ClusterIP
  token: ""
  existingSecret: ""

persistence:
  size: 10Gi
  # Empty means the cluster's default StorageClass.
  storageClass: ""

# The `archived` tier, and where backups go. With nothing set the tier is a
# directory inside the data volume, which is what the pod gets by default.
# `existingClaim` names a ReadWriteMany claim -- an NFS volume, typically --
# mounted at `mountPath` on every pod: the tier lives in `<mountPath>/tier`
# and backups under `<mountPath>/backups`. With an endpoint the tier is an
# S3-compatible bucket instead, reached over plain HTTP (the archive client
# carries no TLS), the credentials from a Secret with the keys
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY: name an existing one, or give
# the pair here and the chart makes one; a claim named as well then carries
# the backups only.
archive:
  endpoint: ""
  bucket: ""
  prefix: ""
  region: ""
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""
  existingClaim: ""
  mountPath: /archive

# Backups: a CronJob that sends `BACKUP TO '<to>'` to every pod's console on
# the schedule. `to` is a name under `<mountPath>/backups` on the claim
# (the default, `nightly`), or `s3://bucket/prefix` through the archive's
# endpoint and credentials. Each pod backs up the shards it holds; restore
# with `RESTORE FROM` on an empty node, as the README says.
backup:
  schedule: ""
  to: nightly

# Performance tunables, one CELASTRO_* variable each, set on every pod; the
# binary's docs/tuning.md lists them with their defaults. For example:
#   tuning:
#     CELASTRO_INSERT_BATCH: "5000"
#     CELASTRO_RESIDENCY_BUDGET_BYTES: "2G"
tuning: {}

# A starting point for a node that ingests, measured (see the binary's
# docs/tuning.md): requests 512Mi, limits 1Gi. The chart passes this map
# through unchanged; empty means no requests and no limits.
# resources:
#   requests: {memory: 512Mi, cpu: "1"}
#   limits: {memory: 1Gi}

probes:
  periodSeconds: 10
  failureThreshold: 3
  # The console answers one request at a time, so a probe behind a long
  # statement waits for it; one second, the default, was seen to time out.
  timeoutSeconds: 5

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
