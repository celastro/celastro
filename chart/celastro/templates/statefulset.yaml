apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "celastro.fullname" . }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
spec:
  # One pod is a database. More are nodes of one cluster: each with its own
  # volume, its own address in the headless service, attaching the others
  # at start. There is no replication between them -- a shard has one
  # holder -- so a pod that is down is its shards down.
  replicas: {{ .Values.replicas }}
  # All at once: every pod attaches the others by retrying until they
  # answer, and none has to wait for a lower ordinal to be ready.
  podManagementPolicy: Parallel
  serviceName: {{ include "celastro.fullname" . }}
  selector:
    matchLabels:
      {{- include "celastro.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "celastro.selectorLabels" . | nindent 8 }}
    spec:
      # The image runs as 65532 and owns /data in the image; a fresh volume
      # is not the image's, so the group is set for it to be writable.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
      # `serve` handles SIGTERM: it stops accepting, saves, and exits 0 well
      # inside this window.
      terminationGracePeriodSeconds: 30
      containers:
        - name: celastro
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $bind := ternary (list "--bind" "0.0.0.0") (list) .Values.console.expose }}
          {{- if gt (int .Values.replicas) 1 }}
          args: {{ concat (list "--dir" "/data" "--port" (.Values.port | toString) "serve") $bind (list "--shard-bind" (printf "0.0.0.0:%d" (int .Values.wire.port))) | toJson }}
          {{- else }}
          args: {{ concat (list "--dir" "/data" "--port" (.Values.port | toString) "serve") $bind | toJson }}
          {{- end }}
          env:
            {{- range $k, $v := .Values.tuning }}
            - name: {{ $k | quote }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: CELASTRO_TLS_CERT
              value: /tls/tls.crt
            - name: CELASTRO_TLS_KEY
              value: /tls/tls.key
            - name: CELASTRO_TLS_CA
              value: /tls/ca.crt
            {{- end }}
            {{- if .Values.encryption.existingSecret }}
            - name: CELASTRO_MASTER_KEY_FILE
              value: /keys/master.key
            - name: CELASTRO_KEY_FILE
              value: /keys/KEY
            {{- end }}
            {{- if .Values.console.expose }}
            - name: CELASTRO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "celastro.consoleSecretName" . }}
                  key: CELASTRO_TOKEN
            {{- end }}
            {{- if gt (int .Values.replicas) 1 }}
            # The pod's stable name is its address: `tcp://<pod>.<service>:<wire port>`.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CELASTRO_NODE
              value: {{ printf "tcp://$(POD_NAME).%s:%d" (include "celastro.fullname" .) (int .Values.wire.port) | quote }}
            - name: CELASTRO_ATTACH
              value: {{ include "celastro.peers" . | quote }}
            - name: CELASTRO_WIRE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "celastro.wireSecretName" . }}
                  key: CELASTRO_WIRE_TOKEN
            {{- end }}
            {{- if .Values.archive.endpoint }}
            - name: CELASTRO_ARCHIVE_ENDPOINT
              value: {{ .Values.archive.endpoint | quote }}
            - name: CELASTRO_ARCHIVE_BUCKET
              value: {{ .Values.archive.bucket | quote }}
            - name: CELASTRO_ARCHIVE_PREFIX
              value: {{ .Values.archive.prefix | quote }}
            - name: CELASTRO_ARCHIVE_REGION
              value: {{ .Values.archive.region | quote }}
            {{- if .Values.archive.caSecret }}
            - name: CELASTRO_ARCHIVE_CA
              value: /archive-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.archive.existingClaim }}
            {{- if not .Values.archive.endpoint }}
            - name: CELASTRO_ARCHIVE_DIR
              value: {{ printf "%s/tier" .Values.archive.mountPath | quote }}
            {{- end }}
            - name: CELASTRO_BACKUP_DIR
              value: {{ printf "%s/backups" .Values.archive.mountPath | quote }}
            {{- end }}
          {{- if .Values.archive.endpoint }}
          envFrom:
            - secretRef:
                name: {{ include "celastro.secretName" . }}
          {{- end }}
          ports:
            - name: console
              containerPort: {{ .Values.port }}
            {{- if gt (int .Values.replicas) 1 }}
            - name: wire
              containerPort: {{ .Values.wire.port }}
            {{- end }}
          # The probes ask the console itself, from inside the pod, and the
          # console answers only after it has read its catalog: a process
          # that is up with a database it cannot open is not ready.
          # Ready means able to coordinate: with peers, the node has to have
          # verified every one of them since it started, or a Service would
          # route a statement to a pod that cannot yet reach the shards it
          # does not hold. Liveness asks only whether it serves.
          readinessProbe:
            exec:
              {{- if gt (int .Values.replicas) 1 }}
              command: ["/celastro", "--port", {{ .Values.port | quote }}, "health", "--attached", {{ sub (int .Values.replicas) 1 | toString | quote }}]
              {{- else }}
              command: ["/celastro", "--port", {{ .Values.port | quote }}, "health"]
              {{- end }}
            # The console serves one request at a time, so a probe that lands
            # behind a statement waits for it; the default second was seen
            # to time out during a rolling restart.
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/celastro", "--port", {{ .Values.port | quote }}, "health"]
            initialDelaySeconds: 10
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.archive.existingClaim }}
            - name: archive
              mountPath: {{ .Values.archive.mountPath | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
            {{- if .Values.encryption.existingSecret }}
            - name: keys
              mountPath: /keys
              readOnly: true
            {{- end }}
            {{- if .Values.archive.caSecret }}
            - name: archive-ca
              mountPath: /archive-ca
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.tls.enabled .Values.archive.existingClaim .Values.encryption.existingSecret .Values.archive.caSecret }}
      volumes:
        {{- if .Values.archive.caSecret }}
        - name: archive-ca
          secret:
            secretName: {{ .Values.archive.caSecret | quote }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "celastro.tlsSecretName" . }}
        {{- end }}
        {{- if .Values.encryption.existingSecret }}
        - name: keys
          secret:
            secretName: {{ .Values.encryption.existingSecret | quote }}
        {{- end }}
        {{- if .Values.archive.existingClaim }}
        - name: archive
          persistentVolumeClaim:
            claimName: {{ .Values.archive.existingClaim | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
