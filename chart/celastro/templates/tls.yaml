{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) (not .Values.tls.certManager.issuerRef.name) }}
{{- fail "tls.enabled needs the material: tls.existingSecret (a Secret with tls.crt, tls.key and ca.crt made by `celastro-cli tls init`) or tls.certManager.issuerRef.name; the chart cannot make Ed25519 certificates itself" }}
{{- end }}
{{- if and .Values.tls.enabled .Values.tls.certManager.issuerRef.name }}
# cert-manager fills the Secret and renews it; the pods read the files at
# start, so a renewal reaches a pod at its next restart. Ed25519, because
# the binary's TLS verifies no other algorithm.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "celastro.fullname" . }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
spec:
  secretName: {{ include "celastro.tlsSecretName" . }}
  commonName: {{ include "celastro.fullname" . }}
  privateKey:
    algorithm: Ed25519
  dnsNames:
    {{- range splitList "," (include "celastro.tlsNames" .) }}
    - {{ . | quote }}
    {{- end }}
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: {{ .Values.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    group: {{ .Values.tls.certManager.issuerRef.group | quote }}
{{- end }}
