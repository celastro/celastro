[package]
name = "celastro"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "Hybrid document database: SQL, BM25 and vector retrieval in a single query plan"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["database", "vector-search", "full-text-search", "hybrid-search", "lsm"]
categories = ["database-implementations", "database"]
repository = "https://github.com/celastro/celastro"
# The logo is the only thing here a build never reads, and at half a megabyte
# it was most of the published tarball: excluding it takes the crate from
# 830 KiB compressed to 334 KiB. `tests/` stays in, because dropping it saves
# 24 KiB and costs the ability to run the suite the README quotes against the
# crate as downloaded — cargo also warns on every publish that it is ignoring
# the test targets. Note this list is the only thing that trims the package:
# .dockerignore has no effect on `cargo package`, which ships tracked files.
exclude = ["assets/*", "Dockerfile", ".dockerignore", ".github/*"]

[dependencies]
# Intentionally none. Celastro is std-only: JSON, bitmaps, term dictionaries,
# postings, quantization, HNSW and the SQL front end are all in-tree, because
# the ordinal-space invariant (§4.2) means every index has to speak the
# segment's own identifier space. Borrowed indexes rarely do.

[lints.clippy]
# Numeric kernels, blocked decoders and column scans index deliberately: the
# loop reads as the arithmetic it implements, and rewriting it as a zip of
# iterators obscures which array the bounds come from.
needless_range_loop = "allow"
# `let mut o = Opts::default(); o.field = x;` is how a caller overrides two of
# twelve knobs. The struct-update alternative is longer and no clearer.
field_reassign_with_default = "allow"

[lib]
name = "celastro"
path = "src/lib.rs"

[[bin]]
name = "celastro"
path = "src/bin/celastro.rs"

# The full command-line tool. `celastro` above stays what it has always been —
# a REPL and script runner — because its interface is documented and in use.
[[bin]]
name = "celastro-cli"
path = "src/bin/celastro-cli.rs"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
# A reachable panic is a bug, not a recoverable condition. Aborting makes that
# explicit and keeps a corrupt segment from being unwound past.
panic = "abort"

[profile.dev]
opt-level = 1
