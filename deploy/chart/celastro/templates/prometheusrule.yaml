{{- if and .Values.monitoring.enabled .Values.monitoring.rules.enabled }}
{{- /* Five rules, and no more: each one is a state an operator has to act
       on and cannot see any other way. Everything else the dashboard in
       deploy/grafana/ draws is for looking at, not for waking someone. */}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "celastro.fullname" . }}
  {{- if .Values.monitoring.namespace }}
  namespace: {{ .Values.monitoring.namespace }}
  {{- end }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: celastro
      rules:
        - alert: CelastroDataKeyRingKept
          expr: celastro_data_key_ring_size > 0
          for: {{ .Values.monitoring.rules.ringFor }}
          labels:
            severity: warning
          annotations:
            summary: "{{ `{{ $labels.instance }}` }} is still keeping {{ `{{ $value }}` }} previous data key(s)"
            description: >-
              A data-key rotation was started and never finished, so objects
              sealed under the old keys still need them. Run `celastro key
              reseal` and then `key retire` on this node. It is not urgent
              and it does not go away on its own.
        - alert: CelastroCertificateExpiring
          expr: (celastro_tls_certificate_expiry_seconds - time()) < {{ mul .Values.monitoring.rules.certDays 86400 }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ `{{ $labels.instance }}` }}'s certificate expires in {{ `{{ $value | humanizeDuration }}` }}"
            description: >-
              The wire and the console both stop when it expires, and every
              pod verifies every other against one CA, so this is the whole
              cluster and not one pod. Replace the material in the Secret;
              cert-manager does it by itself where it issued the
              certificate.
        {{- if gt (int .Values.replicas) 1 }}
        - alert: CelastroNodeNotAttached
          expr: celastro_attached_nodes < {{ sub (add (int .Values.replicas) (int .Values.coordinators.replicas)) 1 }}
          for: {{ .Values.monitoring.rules.attachedFor }}
          labels:
            severity: critical
          annotations:
            summary: "{{ `{{ $labels.instance }}` }} has reached {{ `{{ $value }}` }} of {{ sub (add (int .Values.replicas) (int .Values.coordinators.replicas)) 1 }} peers"
            description: >-
              A node that cannot reach a peer cannot read the shards that
              peer holds, so statements coordinated here answer short or
              refuse. Expected briefly while a pod restarts; sustained, it
              is the wire, the token or the peer itself.
        {{- end }}
        - alert: CelastroSealNotLanding
          expr: increase(celastro_seal_failures_total[10m]) > 0
          for: {{ .Values.monitoring.rules.sealFor }}
          labels:
            severity: warning
          annotations:
            summary: "{{ `{{ $labels.instance }}` }} has been failing to seal for {{ .Values.monitoring.rules.sealFor }}"
            description: >-
              Writes are still acknowledged, from memory and the write-ahead
              log, which is why nothing else notices. But the rows are not
              reaching segments: memory grows, and the next restart replays
              every one of them (celastro_wal_bytes is how much). It is the
              disk -- full, read-only, or its permissions -- and the node's
              log says which at each retry (`seal_failed`,
              `seal_not_installed`).
        - alert: CelastroDataDirectoryGone
          expr: celastro_directory_present == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ `{{ $labels.instance }}` }} cannot see its data directory"
            description: >-
              The volume this node opened is no longer where it was. It can
              still answer from memory, which is why nothing else notices.
              Its writes are going nowhere durable.
        - alert: CelastroLogSyncFailed
          expr: celastro_wal_sync_failed == 1
          labels:
            severity: critical
          annotations:
            summary: "{{ `{{ $labels.instance }}` }} had a write-ahead log sync fail"
            description: >-
              An fdatasync of a shard's log failed. The write it covered was
              refused and taken back off the log; that shard takes no more
              writes, and reads on the node stay at the instant before it.
              A failed sync is not retried, since the page cache cannot be
              trusted with a second one: restart the node, which replays
              the log, after the disk is seen to.
{{- end }}
