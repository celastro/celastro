{{- if and (gt (int .Values.replicas) 1) (not .Values.wire.existingSecret) }}
{{- /* Generated once: an upgrade keeps the token the pods already share,
       or every node would refuse every other until all had restarted. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "celastro.wireSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celastro.wireSecretName" . }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.wire.token }}
  CELASTRO_WIRE_TOKEN: {{ .Values.wire.token | b64enc | quote }}
  {{- else if and $existing (index $existing.data "CELASTRO_WIRE_TOKEN") }}
  CELASTRO_WIRE_TOKEN: {{ index $existing.data "CELASTRO_WIRE_TOKEN" | quote }}
  {{- else }}
  CELASTRO_WIRE_TOKEN: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.console.expose (not .Values.console.existingSecret) }}
{{- /* Generated once, like the wire token: an upgrade keeps the token the
       clients already hold. */ -}}
{{- $existingConsole := lookup "v1" "Secret" .Release.Namespace (include "celastro.consoleSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celastro.consoleSecretName" . }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.console.token }}
  {{- if lt (len .Values.console.token) 16 }}
  {{- fail "console.token must be at least sixteen characters: the console refuses a shorter one" }}
  {{- end }}
  CELASTRO_TOKEN: {{ .Values.console.token | b64enc | quote }}
  {{- else if and $existingConsole (index $existingConsole.data "CELASTRO_TOKEN") }}
  CELASTRO_TOKEN: {{ index $existingConsole.data "CELASTRO_TOKEN" | quote }}
  {{- else }}
  CELASTRO_TOKEN: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.archive.endpoint (not .Values.archive.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "celastro.secretName" . }}
  labels:
    {{- include "celastro.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "archive.accessKeyId is required with an endpoint and no existingSecret" .Values.archive.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "archive.secretAccessKey is required with an endpoint and no existingSecret" .Values.archive.secretAccessKey | quote }}
{{- end }}
