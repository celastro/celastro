# The hosts of the cluster. `ansible_host` is what the controller connects
# to; `celastro_wire_addr` the address the other nodes reach this one at,
# when it is not the same -- a private network behind a public one.
[celastro]
node-0 ansible_host=203.0.113.10 celastro_wire_addr=10.0.0.2
node-1 ansible_host=203.0.113.11 celastro_wire_addr=10.0.0.3
node-2 ansible_host=203.0.113.12 celastro_wire_addr=10.0.0.4

[celastro:vars]
ansible_user=root
